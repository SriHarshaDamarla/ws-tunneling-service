spring:
  application:
    name: tunnel-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/tunnel
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
server:
  port: 8081

logging:
  level:
    com.tunnel.service: DEBUG
